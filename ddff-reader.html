<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel Dukke & Ferdinand Fox — The John Staton Museum</title>
<meta name="description" content="Read Daniel Dukke and Ferdinand Fox, John Staton's college comic strip from the University of Maryland, early 90s.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: 0.25s ease both fade-out; }
  ::view-transition-new(root) { animation: 0.3s ease both fade-in; }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes fade-in  { from { opacity: 0; } }

  :root {
    --ink: #0e0608;
    --crimson: #7c1f26;
    --cream: #f0e8da;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'Lora', serif;
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    background: rgba(14,6,8,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(240,232,218,0.06);
  }
  .nav-back {
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(240,232,218,0.4); text-decoration: none;
    display: flex; align-items: center; gap: 8px; transition: color 0.2s;
  }
  .nav-back svg { width: 13px; height: 13px; transition: transform 0.2s; }
  .nav-back:hover { color: var(--cream); }
  .nav-back:hover svg { transform: translateX(-3px); }
  .nav-center {
    font-family: 'Playfair Display', serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: rgba(240,232,218,0.5);
  }
  .nav-actions { display: flex; align-items: center; gap: 16px; }
  .nav-page-count {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(240,232,218,0.25);
  }
  .nav-all-link {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(240,232,218,0.35); text-decoration: none;
    border: 1px solid rgba(240,232,218,0.12); padding: 5px 12px;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav-all-link:hover { color: var(--cream); border-color: rgba(240,232,218,0.35); }

  /* ── READER ── */
  .reader {
    padding-top: 57px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Single page view */
  .page-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 100px;
    min-height: calc(100vh - 57px);
    position: relative;
  }
  .page-img-wrap {
    position: relative;
    max-width: min(900px, 90vw);
    width: 100%;
  }
  .page-img-wrap img {
    width: 100%;
    height: auto;
    display: block;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }
  .page-label {
    position: absolute;
    bottom: -32px; left: 0;
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(240,232,218,0.2);
  }

  /* ── PREV / NEXT CONTROLS ── */
  .controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    align-items: stretch;
    height: 60px;
    background: rgba(14,6,8,0.95);
    border-top: 1px solid rgba(240,232,218,0.07);
  }
  .ctrl-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: none; border: none; cursor: pointer;
    font-family: 'Lora', serif;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(240,232,218,0.35);
    transition: color 0.2s, background 0.2s;
    padding: 0 32px;
  }
  .ctrl-btn:hover { color: var(--cream); background: rgba(240,232,218,0.03); }
  .ctrl-btn:disabled { opacity: 0.15; cursor: default; }
  .ctrl-btn:disabled:hover { color: rgba(240,232,218,0.35); background: none; }
  .ctrl-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .ctrl-divider {
    width: 1px;
    background: rgba(240,232,218,0.07);
    align-self: stretch;
  }
  .ctrl-progress {
    display: flex; align-items: center; justify-content: center;
    padding: 0 28px;
    font-size: 10px; letter-spacing: 0.15em;
    color: rgba(240,232,218,0.2);
    white-space: nowrap;
    gap: 8px;
  }
  .progress-bar {
    width: 80px; height: 1px;
    background: rgba(240,232,218,0.1);
    position: relative;
  }
  .progress-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: rgba(240,232,218,0.35);
    transition: width 0.3s ease;
  }

  /* ── GRID (all pages view) ── */
  .grid-view {
    padding: 80px 48px 120px;
    display: none;
  }
  .grid-view.active { display: block; }
  .grid-header {
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(240,232,218,0.07);
    display: flex; align-items: baseline; gap: 20px;
  }
  .grid-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px; font-weight: 900;
    text-transform: uppercase; letter-spacing: -0.02em;
  }
  .grid-subtitle {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(240,232,218,0.3);
  }
  .pages-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 4px;
  }
  .grid-thumb {
    position: relative;
    aspect-ratio: 3/4;
    overflow: hidden;
    cursor: pointer;
    background: rgba(240,232,218,0.04);
  }
  .grid-thumb img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    filter: saturate(0.8);
    transition: transform 0.4s ease, filter 0.3s ease;
  }
  .grid-thumb:hover img { transform: scale(1.04); filter: saturate(1); }
  .grid-thumb-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(14,6,8,0.85) 0%, transparent 100%);
    padding: 20px 10px 10px;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(240,232,218,0.5);
    opacity: 0; transition: opacity 0.2s;
  }
  .grid-thumb:hover .grid-thumb-label { opacity: 1; }

  /* Keyboard hint */
  .key-hint {
    position: fixed; bottom: 72px; right: 24px; z-index: 40;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(240,232,218,0.15);
    opacity: 1; transition: opacity 1s ease;
    pointer-events: none;
  }
  .key-hint.hidden { opacity: 0; }

  /* ── FOOTER ── */
  .site-footer{background:#0e0608;color:rgba(240,232,218,0.5);font-family:'Lora',serif;padding:60px 48px 40px;border-top:1px solid rgba(240,232,218,0.07)}
  .footer-copy{font-size:12px;letter-spacing:0.08em;color:rgba(240,232,218,0.2)}

  @media (max-width: 600px) {
    nav { padding: 14px 20px; }
    .nav-center { display: none; }
    .page-view { padding: 20px 12px 90px; }
    .ctrl-btn { font-size: 0; padding: 0 20px; }
    .ctrl-btn svg { width: 20px; height: 20px; }
    .grid-view { padding: 72px 16px 100px; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="topic.html?id=dukke-fox">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
    Daniel Dukke &amp; Ferdinand Fox
  </a>
  <div class="nav-center">The Comic Strip</div>
  <div class="nav-actions">
    <div class="nav-page-count" id="navPageCount"></div>
    <a class="nav-all-link" href="#" id="toggleAllBtn">See all pages</a>
  </div>
</nav>

<!-- SINGLE PAGE READER -->
<div class="reader" id="readerView">
  <div class="page-view" id="pageView">
    <div class="page-img-wrap">
      <img id="currentPageImg" src="" alt="">
      <div class="page-label" id="pageLabel"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
      Previous
    </button>
    <div class="ctrl-divider"></div>
    <div class="ctrl-progress">
      <span id="progressText">1 / 18</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="ctrl-divider"></div>
    <button class="ctrl-btn" id="nextBtn">
      Next
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg>
    </button>
  </div>
</div>

<!-- ALL PAGES GRID -->
<div class="grid-view" id="gridView">
  <div class="grid-header">
    <div class="grid-title">All Pages</div>
    <div class="grid-subtitle" id="gridSubtitle"></div>
  </div>
  <div class="pages-grid" id="pagesGrid"></div>
  <footer class="site-footer" style="margin-top:80px">
    <div class="footer-copy">Fan archive. All artwork belongs to John Staton and respective rights holders. Unofficial.</div>
  </footer>
</div>

<div class="key-hint" id="keyHint">← → arrow keys to navigate</div>

<script>
// Pages in order: cover, 1–16, rear
const PAGES = [
  { id: 'ddff-cover', label: 'Cover',      src: 'img/DanielDukkeFerdinandFox/DDFFCover.png' },
  ...Array.from({length:16},(_,i) => ({
    id: `ddff-page-${String(i+1).padStart(2,'0')}`,
    label: `Page ${i+1}`,
    src:   `img/DanielDukkeFerdinandFox/DDFF${i+1}.png`
  })),
  { id: 'ddff-rear', label: 'Rear Cover', src: 'img/DanielDukkeFerdinandFox/DDFFRear.png' },
];

let current = 0;
let gridOpen = false;

const img        = document.getElementById('currentPageImg');
const pageLabel  = document.getElementById('pageLabel');
const prevBtn    = document.getElementById('prevBtn');
const nextBtn    = document.getElementById('nextBtn');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const navPageCount = document.getElementById('navPageCount');
const toggleAllBtn = document.getElementById('toggleAllBtn');
const readerView   = document.getElementById('readerView');
const gridView     = document.getElementById('gridView');
const pagesGrid    = document.getElementById('pagesGrid');
const keyHint      = document.getElementById('keyHint');

function goTo(n) {
  current = Math.max(0, Math.min(PAGES.length - 1, n));
  const page = PAGES[current];

  // Fade transition
  img.style.opacity = '0';
  img.style.transform = 'scale(0.98)';
  setTimeout(() => {
    img.src = page.src;
    img.alt = page.label;
    img.onload = () => {
      img.style.opacity = '1';
      img.style.transform = 'scale(1)';
    };
  }, 120);
  img.style.transition = 'opacity 0.2s ease, transform 0.2s ease';

  pageLabel.textContent = page.label;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === PAGES.length - 1;
  progressText.textContent = `${current + 1} / ${PAGES.length}`;
  progressFill.style.width = `${((current + 1) / PAGES.length) * 100}%`;
  navPageCount.textContent = page.label;

  // Update URL hash without scrolling
  history.replaceState(null, '', `#${page.id}`);
}

function buildGrid() {
  pagesGrid.innerHTML = '';
  document.getElementById('gridSubtitle').textContent = `${PAGES.length} pages`;
  PAGES.forEach((page, i) => {
    const div = document.createElement('div');
    div.className = 'grid-thumb';
    div.innerHTML = `
      <img src="${page.src}" alt="${page.label}" loading="lazy">
      <div class="grid-thumb-label">${page.label}</div>
    `;
    div.addEventListener('click', () => {
      toggleGrid(false);
      goTo(i);
    });
    pagesGrid.appendChild(div);
  });
}

function toggleGrid(open) {
  gridOpen = open;
  readerView.style.display = open ? 'none' : 'flex';
  gridView.classList.toggle('active', open);
  toggleAllBtn.textContent = open ? 'Back to reader' : 'See all pages';
  if (open && !pagesGrid.children.length) buildGrid();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
toggleAllBtn.addEventListener('click', (e) => { e.preventDefault(); toggleGrid(!gridOpen); });

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (gridOpen) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo(current + 1); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goTo(current - 1); }
});

// Touch swipe
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (gridOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1));
}, {passive:true});

// Hide keyboard hint after 4s
setTimeout(() => keyHint.classList.add('hidden'), 4000);

// Init — check URL hash
const hash = location.hash.slice(1);
const startIndex = PAGES.findIndex(p => p.id === hash);
goTo(startIndex >= 0 ? startIndex : 0);
</script>
</body>
</html>
